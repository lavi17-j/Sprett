<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/admin.css" />
  </head>
  <body>
    <script src="../JS/model.js"></script>
    <script src="../JS/adminPages/adminDashboard.js"></script>
    <script src="../JS/adminUtils/adminHeader.js"></script>
    <script src="../JS/adminUtils/adminSidebar.js"></script>
    <script src="../JS/User/notLoggedInPageView.js"></script>
    <script src="../JS/User/notLoggedInPageController.js"></script>
    <script src="../JS/common/common.js "></script>

    <div id="app"></div>

    <script>
      function updateView() {
        const app = document.getElementById("app");

        if (model.app.loggedInUserId === null) {
          app.innerHTML = updateViewNotLoggedInPage();
        }
        return;
      }

      switch (model.app.currentPage) {
        case "adminDashboard":
          app.innerHTML = updateAdminView();
          break;
        case "LoginScreen":
          app.innerHTML = drawLoginScreen();
          break;
      }

      updateView();
    </script>
  </body>
</html>
